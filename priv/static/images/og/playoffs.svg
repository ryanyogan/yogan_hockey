<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stanley Cup silhouette -->
  <g transform="translate(500, 80)">
    <path d="M100 0 L100 30 L60 30 L60 60 L40 60 L40 100 L60 100 L60 180 L80 200 L120 200 L140 180 L140 100 L160 100 L160 60 L140 60 L140 30 L100 30" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="100" cy="15" rx="40" ry="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
  </g>

  <!-- Bracket preview -->
  <g transform="translate(100, 280)">
    <!-- Round 1 -->
    <rect x="0" y="0" width="180" height="40" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="27" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">FLA vs TOR</text>

    <rect x="0" y="60" width="180" height="40" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="87" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">BOS vs OTT</text>

    <!-- Connector lines -->
    <path d="M180 20 L220 20 L220 80 L180 80" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="220" y1="50" x2="260" y2="50" stroke="#334155" stroke-width="2"/>

    <!-- Round 2 -->
    <rect x="260" y="30" width="180" height="40" rx="4" fill="#1e293b" stroke="url(#accent)"/>
    <text x="350" y="57" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">Conference Semi</text>
  </g>

  <!-- AI Prediction badge -->
  <g transform="translate(750, 280)">
    <rect width="300" height="120" rx="12" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
    <text x="150" y="35" font-family="system-ui" font-size="14" font-weight="bold" fill="#8b5cf6" text-anchor="middle">AI PREDICTION</text>
    <text x="150" y="75" font-family="system-ui" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Panthers 62%</text>
    <text x="150" y="100" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">to win the series</text>
  </g>

  <!-- Title -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">NHL Playoffs</text>

  <!-- Subtitle -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Interactive bracket with AI-powered predictions</text>

  <!-- Branding -->
  <text x="600" y="600" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle">YoganHockey</text>
</svg>
