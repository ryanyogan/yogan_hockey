<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Player cards mockup -->
  <g transform="translate(150, 120)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="125" cy="80" r="50" fill="#334155"/>
    <text x="125" y="160" font-family="system-ui" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Connor McDavid</text>
    <text x="125" y="185" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Edmonton Oilers · C</text>
    <text x="125" y="240" font-family="monospace" font-size="32" font-weight="bold" fill="#3b82f6" text-anchor="middle">72 PTS</text>

    <!-- Card 2 -->
    <rect x="280" y="0" width="250" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="405" cy="80" r="50" fill="#334155"/>
    <text x="405" y="160" font-family="system-ui" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Nathan MacKinnon</text>
    <text x="405" y="185" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Colorado Avalanche · C</text>
    <text x="405" y="240" font-family="monospace" font-size="32" font-weight="bold" fill="#3b82f6" text-anchor="middle">68 PTS</text>

    <!-- Card 3 -->
    <rect x="560" y="0" width="250" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="685" cy="80" r="50" fill="#334155"/>
    <text x="685" y="160" font-family="system-ui" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Nikita Kucherov</text>
    <text x="685" y="185" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Tampa Bay Lightning · RW</text>
    <text x="685" y="240" font-family="monospace" font-size="32" font-weight="bold" fill="#3b82f6" text-anchor="middle">65 PTS</text>
  </g>

  <!-- Search bar mockup -->
  <rect x="350" y="430" width="500" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="380" y="462" font-family="system-ui" font-size="18" fill="#64748b">Search players...</text>

  <!-- Title -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">NHL Players</text>

  <!-- Subtitle -->
  <text x="600" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Search, track favorites &amp; view career stats</text>
</svg>
