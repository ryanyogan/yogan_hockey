<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Team logo placeholder -->
  <g transform="translate(100, 150)">
    <rect width="300" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="150" cy="130" r="80" fill="#334155"/>
    <text x="150" y="250" font-family="system-ui" font-size="24" font-weight="bold" fill="white" text-anchor="middle">NHL Team</text>
  </g>

  <!-- Stats boxes -->
  <g transform="translate(480, 180)">
    <rect width="140" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="70" y="55" font-family="monospace" font-size="36" font-weight="bold" fill="#22c55e" text-anchor="middle">32</text>
    <text x="70" y="80" font-family="system-ui" font-size="14" fill="#64748b" text-anchor="middle">WINS</text>

    <rect x="160" y="0" width="140" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="230" y="55" font-family="monospace" font-size="36" font-weight="bold" fill="#ef4444" text-anchor="middle">15</text>
    <text x="230" y="80" font-family="system-ui" font-size="14" fill="#64748b" text-anchor="middle">LOSSES</text>

    <rect x="320" y="0" width="140" height="100" rx="12" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
    <text x="390" y="55" font-family="monospace" font-size="36" font-weight="bold" fill="#3b82f6" text-anchor="middle">68</text>
    <text x="390" y="80" font-family="system-ui" font-size="14" fill="#3b82f6" text-anchor="middle">POINTS</text>
  </g>

  <!-- Tab indicators -->
  <g transform="translate(480, 320)">
    <rect width="120" height="36" rx="4" fill="url(#accent)"/>
    <text x="60" y="24" font-family="system-ui" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Schedule</text>

    <rect x="130" y="0" width="100" height="36" rx="4" fill="#334155"/>
    <text x="180" y="24" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Roster</text>

    <rect x="240" y="0" width="80" height="36" rx="4" fill="#334155"/>
    <text x="280" y="24" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Stats</text>

    <rect x="330" y="0" width="100" height="36" rx="4" fill="#334155"/>
    <text x="380" y="24" font-family="system-ui" font-size="14" fill="#94a3b8" text-anchor="middle">Injuries</text>
  </g>

  <!-- Title -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">NHL Team Profile</text>

  <!-- Subtitle -->
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Schedule, roster, stats &amp; injury reports</text>

  <!-- Branding -->
  <text x="600" y="600" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle">YoganHockey</text>
</svg>
