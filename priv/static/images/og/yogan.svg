<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="featured" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Featured badge -->
  <rect x="100" y="100" width="140" height="30" rx="4" fill="url(#featured)"/>
  <text x="170" y="122" font-family="system-ui" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">FEATURED</text>

  <!-- Player card -->
  <g transform="translate(100, 150)">
    <rect width="400" height="350" rx="16" fill="#1e293b" stroke="url(#featured)" stroke-width="3"/>

    <!-- Player avatar placeholder -->
    <circle cx="200" cy="100" r="70" fill="#334155"/>
    <text x="200" y="115" font-family="system-ui" font-size="48" fill="#64748b" text-anchor="middle">AY</text>

    <!-- Player info -->
    <text x="200" y="210" font-family="system-ui" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Andrew Yogan</text>
    <text x="200" y="245" font-family="system-ui" font-size="18" fill="#94a3b8" text-anchor="middle">DEL2 · Forward</text>

    <!-- Stats -->
    <g transform="translate(40, 270)">
      <rect width="100" height="60" rx="8" fill="#334155"/>
      <text x="50" y="30" font-family="monospace" font-size="24" font-weight="bold" fill="white" text-anchor="middle">12</text>
      <text x="50" y="50" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">GOALS</text>

      <rect x="110" y="0" width="100" height="60" rx="8" fill="#334155"/>
      <text x="160" y="30" font-family="monospace" font-size="24" font-weight="bold" fill="white" text-anchor="middle">18</text>
      <text x="160" y="50" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">ASSISTS</text>

      <rect x="220" y="0" width="100" height="60" rx="8" fill="url(#accent)" opacity="0.3"/>
      <rect x="220" y="0" width="100" height="60" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <text x="270" y="30" font-family="monospace" font-size="24" font-weight="bold" fill="#3b82f6" text-anchor="middle">30</text>
      <text x="270" y="50" font-family="system-ui" font-size="12" fill="#3b82f6" text-anchor="middle">POINTS</text>
    </g>
  </g>

  <!-- Career timeline hint -->
  <g transform="translate(600, 200)">
    <text x="0" y="0" font-family="system-ui" font-size="18" font-weight="bold" fill="#94a3b8">CAREER JOURNEY</text>

    <g transform="translate(0, 30)">
      <circle cx="10" cy="10" r="8" fill="#334155"/>
      <text x="30" y="15" font-family="system-ui" font-size="16" fill="white">2019 - Youth Hockey</text>

      <line x1="10" y1="25" x2="10" y2="55" stroke="#334155" stroke-width="2"/>
      <circle cx="10" cy="60" r="8" fill="#334155"/>
      <text x="30" y="65" font-family="system-ui" font-size="16" fill="white">2021 - Junior League</text>

      <line x1="10" y1="75" x2="10" y2="105" stroke="#334155" stroke-width="2"/>
      <circle cx="10" cy="110" r="8" fill="url(#accent)"/>
      <text x="30" y="115" font-family="system-ui" font-size="16" fill="white">2024 - DEL2 (Current)</text>
    </g>
  </g>

  <!-- Title -->
  <text x="750" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Andrew Yogan Stats</text>

  <!-- Subtitle -->
  <text x="750" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Complete career statistics &amp; highlights</text>

  <!-- Branding -->
  <text x="600" y="590" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle">YoganHockey</text>
</svg>
