<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Player card -->
  <g transform="translate(100, 100)">
    <rect width="400" height="400" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Player avatar placeholder -->
    <rect x="100" y="40" width="200" height="200" rx="8" fill="#334155"/>
    <text x="200" y="160" font-family="system-ui" font-size="72" fill="#64748b" text-anchor="middle">#</text>

    <!-- Player info -->
    <text x="200" y="290" font-family="system-ui" font-size="28" font-weight="bold" fill="white" text-anchor="middle">NHL Player</text>
    <text x="200" y="320" font-family="system-ui" font-size="16" fill="#94a3b8" text-anchor="middle">Team Name · Position</text>

    <!-- Position badge -->
    <rect x="160" y="340" width="80" height="30" rx="4" fill="url(#accent)" opacity="0.3"/>
    <rect x="160" y="340" width="80" height="30" rx="4" fill="none" stroke="url(#accent)"/>
    <text x="200" y="362" font-family="system-ui" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">C</text>
  </g>

  <!-- Stats section -->
  <g transform="translate(580, 150)">
    <text x="0" y="0" font-family="system-ui" font-size="14" font-weight="bold" fill="#64748b">CURRENT SEASON</text>

    <g transform="translate(0, 30)">
      <rect width="140" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="45" font-family="monospace" font-size="32" font-weight="bold" fill="white" text-anchor="middle">82</text>
      <text x="70" y="70" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">GAMES</text>

      <rect x="160" y="0" width="140" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="230" y="45" font-family="monospace" font-size="32" font-weight="bold" fill="#22c55e" text-anchor="middle">35</text>
      <text x="230" y="70" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">GOALS</text>

      <rect x="320" y="0" width="140" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="390" y="45" font-family="monospace" font-size="32" font-weight="bold" fill="white" text-anchor="middle">50</text>
      <text x="390" y="70" font-family="system-ui" font-size="12" fill="#64748b" text-anchor="middle">ASSISTS</text>
    </g>

    <g transform="translate(80, 140)">
      <rect width="300" height="90" rx="8" fill="url(#accent)" opacity="0.15"/>
      <rect width="300" height="90" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <text x="150" y="45" font-family="monospace" font-size="48" font-weight="bold" fill="#3b82f6" text-anchor="middle">85</text>
      <text x="150" y="75" font-family="system-ui" font-size="14" fill="#3b82f6" text-anchor="middle">TOTAL POINTS</text>
    </g>
  </g>

  <!-- Title -->
  <text x="700" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Player Profile</text>

  <!-- Subtitle -->
  <text x="700" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Career stats, current season &amp; performance</text>

  <!-- Branding -->
  <text x="600" y="590" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle">YoganHockey</text>
</svg>
