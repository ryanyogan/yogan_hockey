<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>

    <!-- Ice texture pattern -->
    <pattern id="ice-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="100" stroke="#2563eb" stroke-width="0.5" opacity="0.1"/>
      <line x1="100" y1="0" x2="0" y2="100" stroke="#2563eb" stroke-width="0.5" opacity="0.1"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#ice-pattern)"/>

  <!-- Decorative ice rink lines -->
  <g stroke="#2563eb" stroke-width="2" opacity="0.2">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <circle cx="600" cy="315" r="80" fill="none"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Goal crease shapes -->
  <g fill="#2563eb" opacity="0.1">
    <ellipse cx="50" cy="315" rx="60" ry="40"/>
    <ellipse cx="1150" cy="315" rx="60" ry="40"/>
  </g>

  <!-- Main content container -->
  <g transform="translate(600, 280)">
    <!-- Logo text -->
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Monaco', monospace" font-weight="700" font-size="72" letter-spacing="-2">
      <tspan fill="#2563eb">YOGAN</tspan><tspan fill="#ffffff" opacity="0.9">HOCKEY</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#ffffff" opacity="0.5" letter-spacing="4">
      LIVE NHL STATS • PLAYER TRACKING
    </text>
  </g>

  <!-- Stats preview boxes -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="180" height="80" rx="4" fill="#1a1a1a" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888" letter-spacing="2">GOALS</text>
    <text x="90" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" fill="#2563eb" font-weight="700">187</text>
  </g>

  <g transform="translate(420, 420)">
    <rect x="0" y="0" width="180" height="80" rx="4" fill="#1a1a1a" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888" letter-spacing="2">ASSISTS</text>
    <text x="90" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" fill="#2563eb" font-weight="700">245</text>
  </g>

  <g transform="translate(640, 420)">
    <rect x="0" y="0" width="180" height="80" rx="4" fill="#1a1a1a" stroke="#eab308" stroke-width="2" opacity="0.8"/>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888" letter-spacing="2">POINTS</text>
    <text x="90" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" fill="#eab308" font-weight="700">432</text>
  </g>

  <g transform="translate(860, 420)">
    <rect x="0" y="0" width="180" height="80" rx="4" fill="#1a1a1a" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
    <text x="90" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888" letter-spacing="2">PPG</text>
    <text x="90" y="62" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" fill="#2563eb" font-weight="700">0.83</text>
  </g>

  <!-- Featured player indicator -->
  <g transform="translate(600, 160)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#eab308"/>
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#000" font-weight="700" letter-spacing="2">ANDREW YOGAN</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#2563eb" stroke-width="3" opacity="0.6">
    <path d="M30 30 L30 80 M30 30 L80 30" fill="none"/>
    <path d="M1170 30 L1170 80 M1170 30 L1120 30" fill="none"/>
    <path d="M30 600 L30 550 M30 600 L80 600" fill="none"/>
    <path d="M1170 600 L1170 550 M1170 600 L1120 600" fill="none"/>
  </g>

  <!-- URL -->
  <text x="600" y="590" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ffffff" opacity="0.3" letter-spacing="2">
    YOGANHOCKEY.COM
  </text>
</svg>
