<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>

  <!-- Stylized Y made from hockey sticks -->
  <g stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left stick -->
    <path d="M12 10L20 22"/>
    <!-- Right stick -->
    <path d="M28 10L20 22"/>
    <!-- Vertical -->
    <path d="M20 22V32"/>
  </g>

  <!-- Hockey puck at intersection -->
  <ellipse cx="20" cy="22" rx="4" ry="1.5" fill="#eab308"/>

  <!-- Stick blades (gold accents) -->
  <path d="M10 8L12 10L14 8" stroke="#eab308" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M26 8L28 10L30 8" stroke="#eab308" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
